name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Package .app
        run: ./package.sh .build/release/StayAwake

      - name: Zip app bundle
        run: |
          cd .build
          ditto -c -k --sequesterRsrc --keepParent StayAwake.app StayAwake.app.zip

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .build/StayAwake.app.zip
