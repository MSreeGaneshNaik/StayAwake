name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "e.g. 15.2 (Sequoia)"
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Apple Silicon or Intel
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include exact terminal output if this is an install/uninstall issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: pmset
    attributes:
      label: Output of `pmset -g | grep disablesleep`
      description: Relevant if this is about lid-close sleep specifically.
      render: shell
